name: Build, verify and publish learning site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python scripts/build.py
      - run: python scripts/check_site.py
      - run: pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser dashboard and book checks
        run: |
          python -m http.server 8769 --directory _site --bind 127.0.0.1 > /tmp/coastal-server.log 2>&1 &
          python scripts/browser_smoke.py --url http://127.0.0.1:8769
          python scripts/lite_smoke.py --url http://127.0.0.1:8769
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
