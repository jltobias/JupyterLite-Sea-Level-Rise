title: "Coastal Futures: Sea-Level Rise, Health Facilities & PEPFAR"
author: "James L. Tobias and contributors; based on Tobias et al., AIDS 2024"
copyright: "2026; third-party materials retain their own rights"
logo: assets/book-mark.svg
only_build_toc_files: true
execute:
  execute_notebooks: "off"
repository:
  url: https://github.com/jltobias/JupyterLite-Sea-Level-Rise
  branch: main
  path_to_book: book
html:
  use_repository_button: true
  use_issues_button: true
  home_page_in_navbar: true
  extra_footer: "Public poster evidence + clearly labeled fictional labs. No real facility-level data are distributed."
parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - html_image
    - html_admonition
sphinx:
  config:
    # Live execution uses JupyterLite, so omit the unused Thebe/Binder extension.
    extensions:
      - sphinx_togglebutton
      - sphinx_copybutton
      - myst_nb
      - jupyter_book
      - sphinx_comments
      - sphinx_external_toc
      - sphinx.ext.intersphinx
      - sphinx_design
      - sphinx_book_theme
    html_static_path: [assets]
    html_css_files: [book.css]
    suppress_warnings: [myst.xref_missing]
